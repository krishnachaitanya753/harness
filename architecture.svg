<text x="20" y="34" font-size="16" font-weight="500" fill="#2C2C2A">Agent harness — end-to-end architecture</text>
<text x="20" y="52" font-size="11" fill="#5F5E5A">the complete target system · agent = model + harness + UI</text>

<rect x="20" y="70" width="150" height="52" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="95" y="92" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">You</text>
<text x="95" y="109" text-anchor="middle" font-size="11" fill="#5F5E5A">task in · answer out</text>

<rect x="200" y="70" width="200" height="52" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="300" y="92" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">terminal UI</text>
<text x="300" y="109" text-anchor="middle" font-size="11" fill="#5F5E5A">chat pane · live trace pane</text>

<rect x="430" y="70" width="200" height="52" rx="4" fill="#EEEDFE" stroke="#534AB7"/>
